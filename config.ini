; Konfigurace ctu-ham-stats. Hodnoty lze přepsat proměnnými prostředí
; (viz app/config.py), ty mají vždy přednost před tímto souborem.

[callsign_mask]
; Zapíná/vypíná maskování konkrétní volací značky v celé aplikaci (API i weby).
enabled = true
; Značka, která se má maskovat (bez ohledu na velikost písmen).
callsign = OL60UFM
; Text, kterým se značka nahradí, pokud je maskování zapnuté.
replacement = neznámá

[mcp]
; Ochrana MCP endpointu (/mcp) proti DNS-rebindingu: povolené hodnoty hlavičky
; Host, oddělené čárkou. Uveď veřejné hostname, na kterém web běží (za reverzní
; proxy je to původní doména, kterou vidí klient). localhost se povolí vždy.
; Prázdná hodnota = přijímat jakýkoli Host (ochranu řeš na proxy).
allowed_hosts = stats.ok1sim.cz

[okres]
; Denní dohledávání okresu ke značkám přes callbooky (QRZ/HamQTH/QRZCQ) a
; promítnutí do tabulky callsign_region (mapa + agregace). Vyžaduje QRZ creds
; v config.local.ini (sekce [qrz]); bez nich se úloha vůbec neregistruje.
; Zapnout/vypnout celou úlohu.
enabled = true
; Časy spuštění (HH:MM oddělené čárkou). Default brzy ráno, mimo ingest.
times = 03:30
; Dny běhu (APScheduler day_of_week): "*" = denně, nebo např. "mon" = jen pondělí.
days = *
; Kolik nevyřešených značek zpracovat za jeden běh (velikost dávky fronty).
; Fronta je round-robin dle fetched_at – nejdéle nezkoušené první, nové na konec.
slice = 150
; Průběžné ukládání po N značkách (odolnost vůči přerušení).
chunk = 100
; Pauza mezi dotazy na callbook v sekundách (throttling).
sleep = 0.5
; Bezpečný strop 24h QRZ lookupů – při dosažení se běh gracefully zastaví
; (chrání účet před odpojením; zbytek se dobere příště).
qrz_count_stop = 7000
