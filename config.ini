; Konfigurace ctu-ham-stats. Hodnoty lze přepsat proměnnými prostředí
; (viz app/config.py), ty mají vždy přednost před tímto souborem.

[callsign_mask]
; Zapíná/vypíná maskování konkrétní volací značky v celé aplikaci (API i weby).
enabled = true
; Značka, která se má maskovat (bez ohledu na velikost písmen).
callsign = OL60UFM
; Text, kterým se značka nahradí, pokud je maskování zapnuté.
replacement = neznámá
