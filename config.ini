; Konfigurace ctu-ham-stats. Hodnoty lze přepsat proměnnými prostředí
; (viz app/config.py), ty mají vždy přednost před tímto souborem.

[callsign_mask]
; Zapíná/vypíná maskování konkrétní volací značky v celé aplikaci (API i weby).
enabled = true
; Značka, která se má maskovat (bez ohledu na velikost písmen).
callsign = OL60UFM
; Text, kterým se značka nahradí, pokud je maskování zapnuté.
replacement = neznámá

[mcp]
; Ochrana MCP endpointu (/mcp) proti DNS-rebindingu: povolené hodnoty hlavičky
; Host, oddělené čárkou. Uveď veřejné hostname, na kterém web běží (za reverzní
; proxy je to původní doména, kterou vidí klient). localhost se povolí vždy.
; Prázdná hodnota = přijímat jakýkoli Host (ochranu řeš na proxy).
allowed_hosts = stats.ok1sim.cz
