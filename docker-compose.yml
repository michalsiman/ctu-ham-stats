services:
  ham-stats:
    build: .
    container_name: ctu-ham-stats
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/srv/data
      - ./config.ini:/srv/app/config.ini:ro
      # Neverzované creds ke callbookům (QRZ/HamQTH/QRZCQ) pro denní dohledávání
      # okresu. Odkomentuj až soubor config.local.ini na serveru existuje – jinak
      # by Docker vyrobil místo něj prázdný adresář a start by spadl. Bez creds se
      # okres úloha stejně nezaregistruje (viz app/main.py), zbytek appky běží.
      # - ./config.local.ini:/srv/app/config.local.ini:ro
    environment:
      - TZ=Europe/Prague
      # časy stahování dat ČTÚ (data se během dne mění)
      - INGEST_TIMES=06:00,14:00
    # Pro nasazení za Traefikem místo ports použij labels, např.:
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.hamstats.rule=Host(`stats.ok1sim.cz`)
    #   - traefik.http.routers.hamstats.tls.certresolver=cloudflare
